<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro SRI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Bienvenido al Registro de cliente</h1>
    </header>

    <section class="contenedor">
        <h2> Datos del Cliente</h2>
        <form id="formularioCliente" class="habilidades">
            

            <div>
                <label for="cedula">Cedula:</label>
                <input type="text" id="cedula" maxlength="10">
            </div>
            <br>
            <br>
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" maxlength="30">
            </div>
            <br>
            <br>
            <div>
                <label for="direccion">Direccion:</label>
                <input type="text" id="direccion" maxlenght="50">
            </div>
            <br>
            <br>
            <div>
                <label for="telefono">Telefono:</label>
                <input type="text" id="telefono" maxlenght="10">
            </div>
            <br>
            <br>
            <div>
                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo">
            </div>
            <br>
            <button type="submit">Guardar</button>
            

        </form>

           <h2>Usuarios registrados</h2>

        <ul class="habilidades">
            <li>
                validacion cedula <br>
                <span id="ErrorCedula" style="color: red"></span>
            </li>
            <li>
                validacion nombre <br>
                <span id="ErrorNombre" style="color: red"></span>
            </li>
            <li>
                validacion direccion<br>
                <span id="ErrorDireccion" style="color: red"></span>
            </li>
            <li>
                validacion telefono<br>
                <span id="ErrorTelefono" style="color: red"></span>
            </li>
            <li>
                validacion correo<br>
            <span id="ErrorCorreo" style="color: red"></span>
            </li>    
        </ul>
        
    

    </section>

    <script src="script.js"></script>
</body>

</html>
