<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Vehículo - Parqueadero ULEAM</title>
    <link rel="stylesheet" href="../../estilos/estilos_generales.css">
    <style>
        .vehicle-container {
            background: var(--color-blanco);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }

        .vehicle-container h2 {
            color: var(--color-primario);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .vehicle-container p {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: var(--transicion);
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--color-secundario);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 85, 165, 0.3);
        }

        .btn-full {
            width: 100%;
            margin-top: 1rem;
        }

        .info-nota {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Parqueadero Inteligente ULEAM</h1>
    </header>

    <main>
        <div class="vehicle-container">
            <h2>Registro de Vehículo</h2>
            <p>Ingrese los datos correspondientes a su vehículo para asociarlo a su cuenta.</p>

            <form action="generar_tag.html" method="GET">
                <div class="form-group">
                    <label for="tipo_vehiculo">Tipo de Vehículo</label>
                    <select id="tipo_vehiculo" name="tipo_vehiculo" required>
                        <option value="">Seleccione...</option>
                        <option value="auto">Automóvil</option>
                        <option value="moto">Motocicleta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="placa">Número de Placa</label>
                    <input type="text" id="placa" name="placa" placeholder="Ej. ABC-1234" style="text-transform: uppercase;" required>
                </div>

                <div class="form-group">
                    <label for="marca">Marca y Modelo</label>
                    <input type="text" id="marca" name="marca" placeholder="Ej. Chevrolet Sail" required>
                </div>

                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="text" id="color" name="color" placeholder="Ej. Gris plomo" required>
                </div>

                <button type="submit" class="btn btn-full">Guardar y Generar TAG</button>
            </form>

            <div class="info-nota">
                <p>Nota: Puede registrar hasta un máximo de 2 vehículos en su perfil activo.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ULEAM - Facultad de Ingeniería y Ciencias Informáticas</p>
    </footer>
<script src="../../javascript/utilidades.js"></script>
<script>
    document.querySelector('form').addEventListener('submit', function(event) {
        const placaInput = document.getElementById('placa').value;

        if (!validarPlacaVehiculo(placaInput)) {
            alert('Error: El formato de la placa es incorrecto. Debe usar el formato estándar (Ej. ABC-1234).');
            event.preventDefault();
            return;
        }
    });
</script>
</body>
</html>
