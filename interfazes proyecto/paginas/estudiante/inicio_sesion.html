<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Parqueadero ULEAM</title>
    <link rel="stylesheet" href="../../estilos/estilos_generales.css">
    <style>
        .auth-container {
            background: var(--color-blanco);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }

        .auth-container h2 {
            color: var(--color-primario);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: var(--transicion);
        }

        .form-group input:focus {
            border-color: var(--color-secundario);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 85, 165, 0.3);
        }

        .btn-full {
            width: 100%;
            margin-top: 1rem;
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--color-secundario);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .volver-inicio {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .volver-inicio:hover {
            color: var(--color-primario);
        }
    </style>
</head>
<body>

    <header>
        <h1>Parqueadero Inteligente ULEAM</h1>
    </header>

    <main>
        <div class="auth-container">
            <h2>Iniciar Sesión</h2>
            <form action="terminos_condiciones.html" method="GET">
                <div class="form-group">
                    <label for="correo">Correo Institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="usuario@live.uleam.edu.ec" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn btn-full">Ingresar</button>
            </form>

            <div class="auth-links">
                <p>¿No tienes una cuenta? <a href="crear_cuenta.html">Regístrate aquí</a></p>
            </div>

            <a href="../../index.html" class="volver-inicio">&larr; Volver al selector principal</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ULEAM - Facultad de Ingeniería y Ciencias Informáticas</p>
    </footer>

    <script src="../../javascript/utilidades.js"></script>
    <script src="../../javascript/login.js"></script>
</body>
</html>
