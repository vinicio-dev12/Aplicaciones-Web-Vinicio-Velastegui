<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Guardia - Parqueadero ULEAM</title>
    <link rel="stylesheet" href="../../estilos/estilos_generales.css">
    <style>
        .auth-container {
            background: var(--color-blanco);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }

        .auth-container h2 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .auth-container p {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: var(--transicion);
        }

        .form-group input:focus {
            border-color: #2c3e50;
            outline: none;
            box-shadow: 0 0 5px rgba(44, 62, 80, 0.3);
        }

        .btn-guardia {
            background-color: #2c3e50;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-guardia:hover {
            background-color: #1a252f;
        }

        .volver-inicio {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .volver-inicio:hover {
            color: var(--color-primario);
        }
    </style>
</head>
<body>

    <header>
        <h1>Parqueadero Inteligente ULEAM</h1>
    </header>

    <main>
        <div class="auth-container">
            <h2>Portal de Guardia</h2>
            <p>Credenciales de acceso para control de garita</p>

            <form action="panel_guardia.html" method="GET">
                <div class="form-group">
                    <label for="usuario_guardia">Usuario / ID de Guardia</label>
                    <input type="text" id="usuario_guardia" name="usuario_guardia" placeholder="Ej. guardia01" required>
                </div>

                <div class="form-group">
                    <label for="password_guardia">Contraseña</label>
                    <input type="password" id="password_guardia" name="password_guardia" placeholder="********" required>
                </div>

                <button type="submit" class="btn btn-guardia">Ingresar al Panel</button>
            </form>

            <a href="../../index.html" class="volver-inicio">&larr; Volver al selector principal</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ULEAM - Facultad de Ingeniería y Ciencias Informáticas</p>
    </footer>

</body>
</html>
