<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parqueadero Inteligente ULEAM</title>
    <link rel="stylesheet" href="estilos/estilos_generales.css">
    <style>
        .selector-container {
            background: var(--color-blanco);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .selector-container h2 {
            color: var(--color-primario);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .selector-container p {
            margin-bottom: 2rem;
            color: #666;
        }

        .acciones-roles {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-guardia {
            background-color: #2c3e50;
        }

        .btn-guardia:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sistema de Parqueadero ULEAM</h1>
    </header>

    <main>
        <div class="selector-container">
            <h2>Bienvenido al Sistema</h2>
            <p>Seleccione el perfil con el que desea acceder a la plataforma:</p>
            
            <div class="acciones-roles">
                <a href="paginas/estudiante/inicio_sesion.html" class="btn">Acceso Estudiante / Personal</a>
                <a href="paginas/guardia/login_guardia.html" class="btn btn-guardia">Acceso Módulo Guardia</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ULEAM - Facultad de Ingeniería y Ciencias Informáticas</p>
    </footer>

</body>
</html>
